name: Engineering CI E2E qualification

on:
  pull_request:
    types: [opened, reopened]
    branches: [engineering/ci-e2e-base]

permissions: {}

jobs:
  qualification:
    if: (github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'engineering/ci-e2e-qualification')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate trigger identity
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_REF" == 'engineering/ci-e2e-qualification' ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          printf 'qualification source: %s %s\n' "$SOURCE_REF" "$SOURCE_SHA"
      - name: Allow time for the CI observer to register
        run: sleep 120
